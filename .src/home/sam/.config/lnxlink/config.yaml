mqtt:
  prefix: lnxlink
  clientId: DESKTOP-Linux
  server: 192.168.178.26
  port: 1883
  clear_on_off: true
  auth:
    user: samuel
    pass: "..."
    tls: false
    keyfile: ''
    certfile: ''
    ca_certs: ''
  discovery:
    enabled: true
    prefix: homeassistant
  lwt:
    enabled: true
    qos: 1
update_interval: 5
update_on_change: false
modules:
  - boot_time
  - cpu
  - gpu
  - current_user
  - display_env
  - gamepad
  - lwt
  - memory
  - network
  - notify
  - power_profile
  - restart
  - session_lock
  - shutdown
  - suspend
  - systemd
  - speaker_used
  - screen_onoff
custom_modules: 
  - /home/sam/.config/lnxlink/cust_mod/hypr_color.py
exclude: []
settings:
  brightness:
    autodiscovery: true
  network:
    split_interfaces: false
    include: []
    exclude: []
  shutdown:
    command: ''
    command_timeout: 120
  steam:
    library: /home/sam/.local/share/Steam/config/libraryfolders.vdf
  systemd: 
    - name: syncthing.service
      user: true
    - name: tailscaled.service
